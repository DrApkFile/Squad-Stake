<template>
  <style>
    /* The problem, in one picture that keeps changing: the pot the hook built is still there,

  <div id="root" data-composition-id="problem" data-width="1920" data-height="1080">

            fill="none" stroke="#0b0b0c" stroke-width="7" stroke-linecap="round" />
          <circle cx="92" cy="70" r="24" fill="#0b0b0c" />
          <line id="problem-eye-strike" x1="16" y1="126" x2="168" y2="14"

  <script>
    (() => {
      const scene = window.__SQUAD_BEATS.problem;
      /* b0 almost everywhere · b1 someone holds it · b2 nobody can check it
         b3 the money does nothing · b4 and it can simply be gone */
      const [b0, b1, b2, b3, b4] = scene.beats;
      const tl = gsap.timeline({ paused: true });

      /* The pot is already on screen: the hook left it there, so the film does not restart. */
      tl.fromTo("#problem-pot", { opacity: 0, scale: 0.9, y: -20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);

      /* "almost everywhere": the same arrangement, repeated around it, then pushed back. */
      for (let index = 0; index < 6; index += 1) {
        tl.fromTo("#problem-tile-" + index, { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, b0 + index * 0.08);
      }
      tl.to(".tile", { opacity: 0.28, scale: 0.9, duration: 0.6, ease: "power2.inOut" }, b1 - 0.2);

      /* "Someone holds the pot." */
      tl.fromTo("#problem-lock", { opacity: 0, y: 26, scale: 0.7 },
        { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.7)" }, b1 + 0.1);

      /* "Nobody else can check it." — the eye is drawn, then struck through. */
      tl.to("#problem-lock", { opacity: 0, duration: 0.25 }, b2 - 0.1);
      const eye = document.querySelector("#problem-eye-path");
      const eyeLength = eye && eye.getTotalLength ? eye.getTotalLength() || 460 : 460;
      tl.fromTo("#problem-eye", { opacity: 0 }, { opacity: 1, duration: 0.14 }, b2);
      tl.fromTo(eye, { strokeDasharray: eyeLength, strokeDashoffset: eyeLength },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, b2);
      tl.fromTo("#problem-eye-strike", { scaleX: 0, transformOrigin: "0% 100%" },
        { scaleX: 1, duration: 0.3, ease: "power4.out" }, b2 + 0.55);

      /* "the money does nothing" — the gold drains to grey and the figure says so. */
      tl.to("#problem-eye", { opacity: 0, duration: 0.25, ease: "power2.in" }, b3 - 0.15);
      tl.to("#problem-pot-fill",
        { background: "linear-gradient(180deg, #d8d6d1, #bdbab3)", duration: 0.7, ease: "power2.inOut" }, b3);
      tl.fromTo("#problem-yield", { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, b3 + 0.3);

      /* "…the whole group loses." The pot does not fade: it drops out of the frame. */
      tl.to("#problem-yield", { opacity: 0, duration: 0.22, ease: "power2.in" }, b4 + 0.9);
      tl.to("#problem-pot-fill", { height: 0, duration: 0.45, ease: "power2.in" }, b4 + 1.0);
      tl.to("#problem-pot",
        { y: 420, scale: 0.72, opacity: 0, duration: 0.6, ease: "power3.in" }, b4 + 1.25);
      tl.to(".tile", { opacity: 0, duration: 0.5, ease: "power2.in" }, b4 + 1.3);

      /* The card lands in the hole the pot left. Word by word, no slide. */
      tl.set("#problem-card", { opacity: 1 }, b4 + 1.7);
      for (let index = 0; index < 2; index += 1) {
        tl.fromTo("#problem-word-" + index, { opacity: 0, filter: "blur(10px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power3.out" },
          b4 + 1.75 + index * 0.22);
      }

      const out = scene.duration - 0.4;
      tl.to("#problem-stage", { opacity: 0, duration: 0.32, ease: "power3.in" }, out);

      window.__timelines["problem"] = tl;
    })();
  </script>
