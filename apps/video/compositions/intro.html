    (() => {
      const scene = window.__SQUAD_BEATS.intro;
      /* b0 so we built it · b1 nobody holds the pot · b2 each share stays and earns
         b3 not typed into a database · b4 read straight from the chain */
      const [b0, b1, b2, b3, b4] = scene.beats;
      const tl = gsap.timeline({ paused: true });

      /* Three seats fly in to where the mark's own members sit, then the mark takes their
         place: the broken ring of the problem, mended into the product. */
      /* Everything here is placed at or after b0, never before it: this scene starts on its
         own first word, so a negative position is clamped to 0 by GSAP and two tweens that
         were meant to run in sequence end up overlapping — which is what put a fade-out
         *inside* the arrival it was supposed to follow (`gsap_tween_tail`, check 2026-11-11). */
      const seats = [{ x: 0, y: -62 }, { x: -54, y: 32 }, { x: 54, y: 32 }];
      seats.forEach((seat, index) => {
        tl.fromTo("#intro-seed-" + index,
          { opacity: 0, x: seat.x * 7, y: seat.y * 7, scale: 2.2 },
          { opacity: 1, x: seat.x, y: seat.y, scale: 1, duration: 0.52, ease: "power3.out" },
          b0 + index * 0.06);
      });
      tl.to(".seed", { opacity: 0, duration: 0.18 }, b0 + 0.68);
      tl.fromTo("#intro-lockup",
        { opacity: 0, scale: 0.72, clipPath: "inset(0 82.67% 0 0)" },
        { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, b0 + 0.64);
      /* The name writes on after the mark has landed; the mark itself then holds dead still. */
      tl.to("#intro-lockup",
        { clipPath: "inset(0 0% 0 0)", duration: 0.62, ease: "power3.out" }, b0 + 1.14);

      /* The thesis card, in the lockup's place. */
      tl.to("#intro-lockup", { opacity: 0, y: -26, duration: 0.3, ease: "power3.in" }, b1 - 0.25);
      tl.set("#intro-card", { opacity: 1 }, b1);
      for (let index = 0; index < 4; index += 1) {
        tl.fromTo("#intro-word-" + index, { opacity: 0, filter: "blur(9px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power4.out" },
          b1 + 0.02 + index * 0.1);
      }

      /* Each member keeps their own coin — the exact opposite of the hook's four coins. */
      tl.to("#intro-card", { opacity: 0, duration: 0.26, ease: "power2.in" }, b2 - 0.35);
      tl.set("#intro-keeps", { opacity: 1 }, b2 - 0.3);
      for (let index = 0; index < 3; index += 1) {
        tl.fromTo("#intro-keeper-" + index, { opacity: 0, y: 34, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
          b2 - 0.25 + index * 0.11);
        /* "staked" is a glow that arrives once and stays: no pulsing loop. */
        tl.to("#intro-coin-" + index,
          { boxShadow: "0 0 0 14px rgba(233, 178, 19, 0.22)", duration: 0.55, ease: "power2.out" },
          b2 + 1.5 + index * 0.1);
        tl.fromTo("#intro-earn-" + index, { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, b2 + 1.75 + index * 0.1);
      }

      /* Not typed into a database — read from the chain. */
      tl.to("#intro-keeps", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, b3 - 0.3);
      tl.set("#intro-source", { opacity: 1 }, b3 - 0.25);
      tl.fromTo(".db", { opacity: 0, scale: 0.88 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, b3 - 0.2);
      tl.fromTo("#intro-db-strike", { scaleX: 0, transformOrigin: "0% 100%" },
        { scaleX: 1, duration: 0.26, ease: "power4.out" }, b3 + 0.7);
      tl.fromTo("#intro-arrow", { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, b4 - 0.15);
      for (let index = 0; index < 4; index += 1) {
        tl.fromTo("#intro-block-" + index, { opacity: 0, scale: 0.7 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, b4 + index * 0.1);
      }
      tl.set("#intro-block-0", { className: "block on" }, b4 + 0.56);
      tl.set("#intro-block-1", { className: "block on" }, b4 + 0.64);
      tl.set("#intro-block-2", { className: "block on" }, b4 + 0.72);
      tl.set("#intro-block-3", { className: "block on" }, b4 + 0.8);
      tl.fromTo("#intro-readout", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, b4 + 0.86);

      /* Hand the frame to the phone: the graphics lift, and screens.html raises it. */
      const out = scene.duration - 0.55;
      tl.to("#intro-stage", { opacity: 0, y: -40, duration: 0.42, ease: "power3.in" }, out);

      window.__timelines["intro"] = tl;
    })();
  </script>
